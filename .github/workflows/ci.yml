name: CI

# Every push and every pull request, main included. The deploy workflow is
# opt-in (DEPLOY_ENABLED), so CI is what proves main still builds and passes.
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Tests exercise the real model, so cache its download between runs.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
      # Auth tests need a token in the environment; any value works — CI is
      # asserting the mechanism, not the value.
      EMBED_API_TOKEN: ci-test-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed-cache
          key: fastembed-${{ hashFiles('requirements.txt') }}

      # Downloads the model on a cold cache (about 67 MB) and runs the API
      # against it for real — auth, batching, vector shape, similarity sanity.
      - name: Tests
        run: pytest -q

  # Runs the real image build so a Dockerfile break is caught in review rather
  # than mid-deploy on the server, where it costs a slow remote failure. This
  # also exercises the build-time model bake and the baked-domain guard.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg SITE_URL=https://ci.invalid \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t semantic-filter-api:ci .
