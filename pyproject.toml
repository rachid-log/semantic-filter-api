[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests set env vars before importing the app — deliberate, not sloppiness.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` (unlike `python -m pytest`) does not put the repo root on
# sys.path, so `from app.main import app` fails without this line.
pythonpath = ["."]
